  <main id="root" data-composition-id="demo" data-width="960" data-height="540">

    <p class="subline">Your last five keystrokes, always in view.</p>

    <section class="sample-card" aria-label="Typing sample">
      <div class="sample-label">Typing sample</div>
      <div class="sample-line"><span id="sample-text"></span><span id="type-cursor">▍</span></div>
    </section>

    <section class="key-panel" aria-label="KeyDesk floating display">
      <div class="panel-label">RECENT KEYS</div>
      <div class="panel-live"><span class="live-dot"></span> LIVE</div>
      <div class="key-readout"><span id="recent-keys">Ready</span><span id="panel-cursor">▏</span></div>
      <div class="panel-time">CURRENT TIME <strong>4:54:57 PM</strong></div>
    </section>

    <div class="screen-heading">THE KEYDESK DASHBOARD</div>

      <img src="assets/keydesk-overview.png" alt="KeyDesk dashboard showing its clock, timer, alarm, and stopwatch" />
    </div>
    <p class="screen-caption"><strong>Clock · Alarm · Timer</strong><span>Notes · To-do list · Color themes</span></p>
  </main>

  <script>
    const sample = document.getElementById("sample-text");
    const recent = document.getElementById("recent-keys");
    const typeCursor = document.getElementById("type-cursor");
    const panelCursor = document.getElementById("panel-cursor");
    const segments = [
      { text: "Keys appear as you type.", start: 0.32, typed: 1.72, hold: 1.98, erased: 2.28 },
      { text: "Clock, timer, notes, to-do.", start: 2.46, typed: 3.91, hold: 4.16, erased: 4.46 },
      { text: "Your last five keys stay in view.", start: 4.64, typed: 6.35, hold: 6.62, erased: 6.92 },
    ];

    function stateAt(time) {
      for (const segment of segments) {
        if (time < segment.start || time > segment.erased) continue;
        if (time < segment.typed) {
          const amount = Math.max(0, Math.min(1, (time - segment.start) / (segment.typed - segment.start)));
          const visible = segment.text.slice(0, Math.floor(amount * segment.text.length));
          return { sample: visible, recent: visible.slice(-5) || "K" };
        }
        if (time < segment.hold) return { sample: segment.text, recent: segment.text.slice(-5) };
        if (time < segment.erased) {
          const amount = (time - segment.hold) / (segment.erased - segment.hold);
          const remaining = Math.max(0, segment.text.length - Math.ceil(amount * segment.text.length));
          return { sample: segment.text.slice(0, remaining), recent: "⮨" };
        }
      }
      return { sample: "", recent: "Ready" };
    }

    const tl = gsap.timeline({ paused: true });
    const clock = { t: 0 };
    tl.to(clock, {
      t: 8,
      duration: 8,
      ease: "none",
      onUpdate: () => {
        const state = stateAt(clock.t);
        sample.textContent = state.sample;
        recent.textContent = state.recent;
      },
    }, 0);
    const blink = { p: 0 };
    tl.to(blink, {
      p: Math.PI * 16,
      duration: 8,
      ease: "none",
      onUpdate: () => {
        const visible = Math.floor(blink.p / Math.PI) % 2 === 0 ? "1" : "0";
        typeCursor.style.opacity = visible;
        panelCursor.style.opacity = visible;
      },
    }, 0);
    window.__timelines["demo"] = tl;
  </script>
